version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-intellirity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-intellirity_secret}
      POSTGRES_DB: ${POSTGRES_DB:-intellirity_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-intellirity}:${POSTGRES_PASSWORD:-intellirity_secret}@db:5432/${POSTGRES_DB:-intellirity_db}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-your-super-secret-key-change-in-production}
      VPI_SIGNING_KEY: ${VPI_SIGNING_KEY:-}
      INTELLIRITY_API_KEY_HASHES: ${INTELLIRITY_API_KEY_HASHES:-}
      OPENCODEZEN_API_KEY: ${OPENCODEZEN_API_KEY:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      # A production value here makes the backend refuse to start with
      # insecure defaults (no auth, default secret key).
      ENVIRONMENT: ${ENVIRONMENT:-development}
    volumes:
      - ./backend:/app
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./Intellirity-Frontend
    ports:
      - "3000:3000"
    environment:
      # Next.js reads env vars at build time for rewrites, so the backend URL
      # is passed as a build arg as well as a runtime env var.
      BACKEND_INTERNAL_URL: http://backend:8000/api/v1
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_GATEWAY_URL: ${NEXT_PUBLIC_GATEWAY_URL:-}
      NEXT_PUBLIC_DEPLOY_ENV: ${NEXT_PUBLIC_DEPLOY_ENV:-development}
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
