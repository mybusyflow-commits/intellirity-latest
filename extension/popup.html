<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 340px; margin: 0; padding: 14px; font: 13px/1.5 system-ui, sans-serif; background: #0a0b0d; color: #eceef1; }
    h1 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
    h1 span { color: #8b949e; font-weight: 400; }
    textarea { width: 100%; box-sizing: border-box; min-height: 90px; background: #14161a; color: #eceef1; border: 1px solid #2a2e35; border-radius: 8px; padding: 8px; font: 12px/1.5 ui-monospace, monospace; resize: vertical; }
    button { width: 100%; margin-top: 8px; height: 34px; border: 0; border-radius: 8px; background: #eceef1; color: #0a0b0d; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .5; }
    #out { margin-top: 10px; font: 12px/1.6 ui-monospace, monospace; white-space: pre-wrap; }
    .ok { color: #3fb950; } .warn { color: #d29922; } .bad { color: #f85149; } .dim { color: #8b949e; }
    .row { display: flex; gap: 6px; margin-top: 8px; }
    .row input { flex: 1; background: #14161a; color: #eceef1; border: 1px solid #2a2e35; border-radius: 8px; padding: 6px 8px; font-size: 11px; }
  </style>
</head>
<body>
  <h1>Intellirity <span>prompt shield</span></h1>
  <textarea id="t" placeholder="Paste a prompt to screen it…"></textarea>
  <button id="go">Scan prompt</button>
  <div class="row">
    <input id="base" placeholder="engine http://localhost:8000" />
  </div>
  <div id="out" class="dim">verdicts appear here</div>
  <script src="popup.js"></script>
</body>
</html>
