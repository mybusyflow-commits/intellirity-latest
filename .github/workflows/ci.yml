name: CI

# Every push and pull request must typecheck, build and pass the engine
# suite. The suite runs with the database explicitly disabled, so CI needs
# no Postgres service and can never touch a live URL by accident.

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Test
        working-directory: backend
        env:
          INTELLIRITY_DISABLE_DB: "1"
          ENVIRONMENT: development
        run: python -m pytest tests/ -q

  frontend:
    name: Console typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Intellirity-Frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Intellirity-Frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  dependencies:
    name: Production dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Intellirity-Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Only production dependencies gate the build. Dev-only advisories in
      # the lint toolchain are reported by Dependabot, not here.
      - run: npm audit --omit=dev
